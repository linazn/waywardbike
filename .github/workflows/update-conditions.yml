name: Daily riding conditions update

on:
  # GitHub often starts scheduled runs late, so there are two tries a day.
  # The first one that gets through does the update; the later one sees it's done and stops.
  schedule:
    - cron: "23 4 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: conditions-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip if today's update already landed
        id: check
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"generated\":\"$today" data/conditions.json; then
            echo "Already updated today ($today); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Fetch riding conditions (Open-Meteo)
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/update_conditions.py --pause 0.5

      - name: Commit if anything changed
        if: always() && steps.check.outputs.skip != 'true'   # save whatever was fetched, even if the step above failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conditions.json data/cache
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Riding conditions update ($(date -u +%Y-%m-%d))"
            # someone may have pushed site changes during the run: catch up first
            git pull --rebase origin main
            git push
          fi
